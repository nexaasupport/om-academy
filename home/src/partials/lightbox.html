<!-- Start Gallery Lightbox: pages through the currently filtered photos -->
<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden data-lightbox>
    <div class="lb-stage">

        <div class="lb-top">
            <div class="lb-counter" data-lb-counter></div>
            <div class="lb-title-center" data-lb-title></div>
            <div class="lb-actions">
                <button type="button" class="lb-icon-btn" data-lb-zoom-out aria-label="Zoom out">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg>
                </button>
                <button type="button" class="lb-icon-btn" data-lb-zoom-in aria-label="Zoom in">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm2.5-4h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
                </button>
                <button type="button" class="lb-icon-btn" data-lb-expand aria-label="Toggle expanded view">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
                <button type="button" class="lb-icon-btn" data-lb-close aria-label="Close photo viewer">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </div>

        <div class="lb-main">
            <button type="button" class="lb-arrow-btn lb-prev" data-lb-prev aria-label="Previous photo">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <img class="lb-img" data-lb-img src="assets/img/om-academy-building.jpeg" alt="" loading="lazy" decoding="async">
            <button type="button" class="lb-arrow-btn lb-next" data-lb-next aria-label="Next photo">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>

        <div class="lb-caption">
            <span class="lb-tag" data-lb-tag></span>
            <span class="lb-caption-title" data-lb-caption-title></span>
            <span class="lb-caption-note" data-lb-caption></span>
        </div>

        <div class="lb-thumbs" data-lb-thumbs></div>
    </div>
</div>
<!-- End Gallery Lightbox -->
